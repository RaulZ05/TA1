name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build y Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint + Stylelint)
        run: npm run lint

      - name: Build (frontend a dist/)
        run: npm run build

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    name: Pruebas
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests (node:test)
        run: npm test

  deploy:
    name: Deploy (puesta en producción verificada)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build (frontend a dist/)
        run: npm run build

      - name: Puesta en marcha y verificación (smoke test)
        run: |
          export LLAMPAYEC_DB_PATH="$(mktemp -d)/deploy.db"
          export PORT=3900

          # Sembrar una BD temporal (respeta LLAMPAYEC_DB_PATH)
          node server/seed.js

          # Arrancar el servidor como en producción (sirve dist/)
          (node server/index.js >/tmp/llampayec.log 2>&1 &)

          # Esperar a que el puerto responda
          for i in $(seq 1 30); do
            curl -sf -o /dev/null "http://127.0.0.1:${PORT}/" && break
            sleep 1
          done

          CODE_HOME="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}/")"
          CODE_API="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}/api/products")"
          LOGIN="$(curl -s -X POST "http://127.0.0.1:${PORT}/api/auth/login" -H 'Content-Type: application/json' -d '{"email":"admin@llampayec.com","password":"admin123"}')"

          echo "HOME=$CODE_HOME API=$CODE_API"
          echo "$LOGIN" | grep -q '"token"' && echo "LOGIN=OK" || echo "LOGIN=FAIL"

          pkill -f "node server/index.js" || true

          [ "$CODE_HOME" = "200" ] || { echo "::error::El frontend no respondió 200"; cat /tmp/llampayec.log; exit 1; }
          [ "$CODE_API" = "200" ] || { echo "::error::La API no respondió 200"; cat /tmp/llampayec.log; exit 1; }
          echo "$LOGIN" | grep -q '"token"' || { echo "::error::El login de admin no devolvió token"; cat /tmp/llampayec.log; exit 1; }

          echo "✅ Deploy verificado: frontend servido desde dist/, API y login operativos"